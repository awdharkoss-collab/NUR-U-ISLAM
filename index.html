<script>
const DB=[
[1,"Fâtiha","الفاتحة",7,"Mekkî Dönem (Hicret Öncesi)","Kur'an-ı Kerim'in ilk suresi ve 'Ümmü'l-Kitâb' (Kitabın Anası) olarak bilinir. İslam'ın temel özeti olan hamd, tevhid, ahiret inancı ve yalnızca Allah'a kulluk edip O'ndan hidayet dileme bilincini öğretmek için nazil olmuştur."],
[2,"Bakara","البقرة",286,"Medenî Dönem (Hicret Sonrası)","Kur'an'ın en uzun suresidir. İslam toplumunun hukuki, sosyal ve ibadi temellerini (namaz, oruç, hac, zekat, aile hukuku, faiz yasağı) belirlemek ve mümin, kafir, münafık tiplerini tanıtmak amacıyla Medine'de indirilmiştir."],
[3,"Âl-i İmrân","آل عمران",200,"Medenî Dönem (Hicret Sonrası)","Bedir ve Uhud savaşlarının derslerini değerlendirmek, müminlere sabır ve sebat aşılamak ve Necran Hristiyan heyetiyle yapılan tevhid münazaralarına açıklık getirmek için nazil olmuştur."],
[4,"Nisâ","النساء",176,"Medenî Dönem (Hicret Sonrası)","Uhud Savaşı sonrası yetimlerin ve kadınların haklarını korumak, miras hukukunu adaletle düzenlemek ve aile içi toplumsal düzeni kurmak amacıyla indirilmiştir."],
[5,"Mâide","المائدة",120,"Medenî Dönem (Veda Haccı Dönemi)","Nüzulü en son tamamlanan surelerdendir. Ahitlere vefa, helal-haram sınırları, abdest/teyemmüm hükümleri ve dinin kemale erdiğini müjdelemek için nazil olmuştur."],
[6,"En'âm","الأنعام",165,"Mekkî Dönem (Hicret Öncesi)","Mekke müşriklerinin putperestlik ve batıl kurban/adak geleneklerini reddetmek, tevhid, nübüvvet ve öldükten sonra diriliş akidesini kesin delillerle yerleştirmek için indirilmiştir."],
[7,"A'râf","الأعراف",206,"Mekkî Dönem (Hicret Öncesi)","Hz. Adem'den itibaren peygamberlerin kavimleriyle mücadelesini anlatarak hak ile batıl arasındaki ebedi savaşı ve mahşer günü cennetle cehennem arasındaki A'raf ehlini bildirmek için nazil olmuştur."],
[8,"Enfâl","الأنفال",75,"Medenî Dönem (Bedir Savaşı Sonrası)","Bedir Zaferi'nin ardından savaş ganimetlerinin taksimi, ilahi yardımın sırrı ve İslam savaş ahlakını öğretmek için indirilmiştir."],
[9,"Tevbe","التوبة",129,"Medenî Dönem (Tebük Seferi Dönemi)","Kur'an'da başında Besmele bulunmayan tek suredir. Müşriklerle yapılan antlaşmaların feshi, Tebük Seferi'nde samimi müminlerle münafıkların ayrışması ve samimi tövbenin kabulü için nazil olmuştur."],
[10,"Yûnus","يونس",109,"Mekkî Dönem (Hicret Öncesi)","Vahiy ve peygamberliğe şüpheyle yaklaşan Mekke müşriklerine kainattaki ilahi düzeni ve Hz. Yunus'un kavminin tövbe ederek azaptan kurtuluşunu ibret olarak sunmak için indirilmiştir."],
[11,"Hûd","هود",123,"Mekkî Dönem (Hicret Öncesi)","Peygamber Efendimize 'Beni Hûd suresi ihtiyarlattı' dedirten bu sure; Nuh, Hud, Salih, Lut ve Şuayb peygamberlerin kavimlerinin helakini anlatarak istikamet üzere olmayı emretmek için nazil olmuştur."],
[12,"Yûsuf","يونس / يوسف",111,"Mekkî Dönem (Hüzün Yılı)","Peygamberimizin amcası Ebu Talip ve eşi Hz. Hatice'yi kaybettiği 'Hüzün Yılı'nda teselli vermek ve Hz. Yusuf'un kuyudan Mısır sultanlığına uzanan sabır ve iffet zaferini anlatmak için tek seferde indirilmiştir."],
[13,"Ra'd","الرعد",43,"Medenî Dönem","Tabiat olaylarının (gök gürültüsü, şimşek, yağmur) Allah'ın kudretine işaret ettiğini ve hak ile batılın su üzerindeki köpük misali ayrışacağını göstermek için nazil olmuştur."],
[14,"İbrâhîm","إبراهيم",52,"Mekkî Dönem (Hicret Öncesi)","İnsanları karanlıklardan aydınlığa çıkarmak, nimetlere şükrün bereketini bildirmek ve Hz. İbrahim'in Kabe ve nesli için yaptığı duaları aktarmak amacıyla indirilmiştir."],
[15,"Hicr","الحجر",99,"Mekkî Dönem (Hicret Öncesi)","Kur'an-ı Kerim'in kıyamete kadar bizzat Allah tarafından korunacağını müjdelemek ve Semud kavmi ile Hicr halkının akıbetinden ibret alınmasını sağlamak için nazil olmuştur."],
[16,"Nahl","النحل",128,"Mekkî Dönem (Hicret Öncesi)","Arının bal yapmasından gökten inen yağmura kadar insanlığa sunulan sayısız nimetleri hatırlatarak şükür ve tefekkür bilinci oluşturmak için indirilmiştir."],
[17,"İsrâ","الإسراء",111,"Mekkî Dönem (Miraç Gecesi Dönemi)","Peygamberimizin Mescid-i Haram'dan Mescid-i Aksa'ya yürütülüşünü (İsra) bildirmek ve anne-babaya iyilik, yetim hakkı, dürüstlük gibi temel ahlak ilkelerini vazetmek için nazil olmuştur."],
[18,"Kehf","الكهف",110,"Mekkî Dönem (Hicret Öncesi)","Mekke müşriklerinin Yahudi alimlerden öğrenip sorduğu Ashab-ı Kehf, Hz. Musa-Hızır kıssası ve Zülkarneyn sorularına cevap vermek ve ahir zaman fitnelerinden korunma yolunu göstermek için indirilmiştir."],
[19,"Meryem","مريم",98,"Mekkî Dönem (Habeşistan Hicreti Dönemi)","Habeşistan'a hicret eden sahabelerin Necaşi huzurunda okuduğu suredir; Hz. Zekeriya, Hz. Yahya, Hz. Meryem ve Hz. İsa'nın mucizevi doğumlarını anlatarak tevhidi savunmak için nazil olmuştur."],
[20,"Tâ-Hâ","طه",135,"Mekkî Dönem (Hz. Ömer'in İslam'a Giriş Dönemi)","Hz. Ömer'in okuyup Müslüman olmasına vesile olan suredir; Hz. Musa'nın Firavun'a karşı mücadelesini anlatarak Peygamberimize teselli ve güç vermek için indirilmiştir."],
[21,"Enbiyâ","الأنبياء",112,"Mekkî Dönem (Hicret Öncesi)","Bütün peygamberlerin aynı tevhid mesajıyla gönderildiğini vurgulamak ve Hz. İbrahim'in ateşe atılması ile Hz. Yunus'un duası gibi kurtuluş mucizelerini hatırlatmak için nazil olmuştur."],
[22,"Hac","الحج",78,"Medenî Dönem","Hac ibadetinin hikmetlerini, Kabe'nin tevhid merkezi oluşunu ve haksızlığa uğrayan müminlere ilk kez meşru savunma (savaş) izninin verildiğini bildirmek için indirilmiştir."],
[23,"Mü'minûn","المؤمنون",118,"Mekkî Dönem (Hicret Öncesi)","Kurtuluşa eren gerçek müminlerin vasıflarını (huşu ile namaz, boş işlerden yüz çevirme, zekat, iffet ve emanete riayet) tanıtmak için nazil olmuştur."],
[24,"Nûr","النور",64,"Medenî Dönem (İfk Hadisesi Sonrası)","Hz. Aişe validemize atılan iftirayı (İfk hadisesi) kesin olarak temize çıkarmak, aile mahremiyeti, örtünme ve toplumsal iffet kurallarını belirlemek için indirilmiştir."],
[25,"Furkân","الفرقان",77,"Mekkî Dönem (Hicret Öncesi)","Hak ile batılı ayıran Kur'an'ın ilahi kaynaklı olduğunu ispatlamak ve 'Rahmân'ın has kulları'nın (İbâdü'r-Rahmân) mütevazı yaşam tarzını örnek göstermek için nazil olmuştur."],
[26,"Şuarâ","الشعراء",227,"Mekkî Dönem (Hicret Öncesi)","Peygamberimizi inkarcıların tutumu yüzünden kendini harap etmemesi konusunda teselli etmek ve hakikat şairleri ile heva peşinde koşan şairlerin farkını açıklamak için indirilmiştir."],
[27,"Neml","النمل",93,"Mekkî Dönem (Hicret Öncesi)","Hz. Süleyman'ın karınca vadisinden geçişini, Hüdhüd kuşu ve Sebe Melikesi Belkıs'ın İslam'a girişini anlatarak ilim ve hikmetin üstünlüğünü göstermek için nazil olmuştur."],
[28,"Kasas","القصص",88,"Mekkî Dönem (Hicret Yolculuğu Sırası)","Mekke'den Medine'ye hicret ederken Cuhfe mevkiinde nazil olmuş, Hz. Musa'nın Firavun sarayında büyüyüp Mısır'a dönüşü gibi Peygamberimizin de Mekke'ye muzaffer döneceğini müjdelemiştir."],
[29,"Ankebût","العنكبوت",69,"Mekkî Dönem (Hicret Öncesi)","İman edenlerin mutlaka imtihandan geçirileceğini bildirmek ve Allah'tan başka dost edinenlerin durumunu örümcek ağı (beytü'l-ankebût) kadar çürük diye tanımlamak için indirilmiştir."],
[30,"Rûm","الروم",60,"Mekkî Dönem (M.S. 615 Civarı)","Sasanilere yenilen Bizans'ın (Rûm) birkaç yıl içinde galip geleceği gayb haberini vermek ve kainattaki zıtlıkların Allah'ın varlığına delil olduğunu göstermek için nazil olmuştur."],
[31,"Lokmân","لقمان",34,"Mekkî Dönem (Hicret Öncesi)","Hz. Lokman'ın oğluna verdiği hikmetli öğütler üzerinden şirkten sakınmayı, anne-babaya saygıyı, namazı ve alçakgönüllülüğü öğretmek için indirilmiştir."],
[32,"Secde","السجدة",30,"Mekkî Dönem (Hicret Öncesi)","Vahyin alemlerin Rabbi tarafından indirildiğini teyit etmek, gece ibadetine kalkan müminleri övmek ve kıyamet gerçeğini hatırlatmak için nazil olmuştur."],
[33,"Ahzâb","الأحزاب",73,"Medenî Dönem (Hendek Savaşı Sonrası)","Hendek Savaşı'ndaki ilahi yardımı anlatmak, Peygamberimizin aile hayatını düzenlemek ve evlatlık/tesettür hükümlerini açıklamak için indirilmiştir."],
[34,"Sebe'","سبأ",54,"Mekkî Dönem (Hicret Öncesi)","Hz. Davud ve Hz. Süleyman'a verilen nimetlere karşılık şükredenlerle, nimete nankörlük edip Arim seliyle helak olan Sebe halkının ibretlik sonunu karşılaştırmak için nazil olmuştur."],
[35,"Fâtır","فاطر",45,"Mekkî Dönem (Hicret Öncesi)","Gökleri ve yeri yoktan yaratan Allah'ın sonsuz kudretini, meleklerin mahiyetini ve gerçek alimlerin Allah'a karşı derin saygı (haşyet) duyduğunu bildirmek için nazil olmuştur."],
[36,"Yâsîn","يس",83,"Mekkî Dönem (Hicret Öncesi)","'Kur'an'ın Kalbi' olarak nitelendirilir. Peygamberimizin risaletini, Antakya halkına gelen elçileri, kainattaki diriliş delillerini ve ahiret hesabını sarsıcı bir üslupla hatırlatmak için indirilmiştir."],
[37,"Sâffât","الصافات",182,"Mekkî Dönem (Hicret Öncesi)","Saf saf dizilen melekler üzerine yeminle başlayarak meleklerin Allah'ın kızları olduğu yönündeki cahiliye inancını yıkmak ve Hz. İbrahim ile Hz. İsmail'in teslimiyetini anlatmak için nazil olmuştur."],
[38,"Sâd","ص",88,"Mekkî Dönem (Hicret Öncesi)","Mekke ileri gelenlerinin tevhid çağrısına karşı kibirlenmelerini eleştirmek ve Hz. Davud, Hz. Süleyman ile Hz. Eyyub'un sabır imtihanlarını örnek göstermek için indirilmiştir."],
[39,"Zümer","الزمر",75,"Mekkî Dönem (Hicret Öncesi)","İbadetin yalnızca Allah'a has kılınmasını (ihlas) emretmek, günaha batmış kullara Allah'ın rahmetinden ümit kesmemeleri gerektiğini müjdelemek ve cennet ile cehennem zümrelerini tasvir etmek için nazil olmuştur."],
[40,"Mü'min","غافر",85,"Mekkî Dönem (Hicret Öncesi)","Firavun ailesinden olup imanını gizleyen yiğit müminin hakikati savunuşunu anlatmak ve 'Bana dua edin, size icabet edeyim' müjdesini vermek için indirilmiştir."],
[41,"Fussilet","فصلت",54,"Mekkî Dönem (Hicret Öncesi)","Utbe bin Rebîa'nın Peygamberimize teklif getirmesi üzerine okunan, ayetleri apaçık açıklanmış Kur'an'ın hem kainatta hem insanın kendi nefsindeki ayetlerle doğrulandığını bildiren suredir."],
[42,"Şûrâ","الشورى",53,"Mekkî Dönem (Hicret Öncesi)","Bütün peygamberlere aynı dinin vahyedildiğini bildirmek ve müminlerin işlerini kendi aralarında istişare (şûrâ) ile yürütmeleri ilkesini koymak için nazil olmuştur."],
[43,"Zuhruf","الزخرف",89,"Mekkî Dönem (Hicret Öncesi)","Dünya süs ve zenginliğinin (zuhruf) üstünlük ölçüsü olmadığını, asıl değerin takva ve Kur'an'a sarılmak olduğunu vurgulamak için indirilmiştir."],
[44,"Duhân","الدخان",59,"Mekkî Dönem (Hicret Öncesi)","Mekke'de yaşanan şiddetli kıtlık ve göğü kaplayan duman (duhan) hadisesi üzerine Kur'an'ın mübarek bir gecede (Kadir Gecesi) indirildiğini hatırlatmak için nazil olmuştur."],
[45,"Câsiye","الجاثية",37,"Mekkî Dönem (Hicret Öncesi)","Hesap günü korkudan diz üstü çökecek (câsiye) ümmetleri tasvir ederek zamanın her şeyi yok ettiğini sanan materyalist (dehriyye) anlayışı çürütmek için indirilmiştir."],
[46,"Ahkâf","الأحقاف",35,"Mekkî Dönem (Hicret Öncesi)","Taif dönüşü Nahle vadisinde Peygamberimizden Kur'an dinleyip iman eden cin topluluğunu haber vermek ve anne-babaya iyiliği emretmek için nazil olmuştur."],
[47,"Muhammed","محمد",38,"Medenî Dönem (Hicret Sonrası)","İman edip salih amel işleyenlerin günahlarının örtüleceğini müjdelemek ve hak uğruna mücadele eden müminlere ilahi yardımın şartlarını bildirmek için indirilmiştir."],
[48,"Fetih","الفتح",29,"Medenî Dönem (Hudeybiye Dönüşü)","Hudeybiye Antlaşması'ndan dönerken nazil olmuş, görünürde taviz gibi duran bu antlaşmanın aslında 'apaçık bir fetih' (Feth-i Mübîn) ve Mekke'nin fethinin başlangıcı olduğunu müjdelemiştir."],
[49,"Hucurât","الحجرات",18,"Medenî Dönem (Heyetler Yılı)","İslam toplumunun adab-ı muaşeret yasasıdır: Peygambere saygı, haberleri araştırmadan inanmama, alay etmeme, lakap takmama, suizan ve gıybetten kaçınma ile üstünlüğün ancak takvada olduğunu bildirmek için indirilmiştir."],
[50,"Kâf","ق",45,"Mekkî Dönem (Hicret Öncesi)","Öldükten sonra dirilişi inkar edenlere insanın yaratılışını, şah damarından yakın olan Allah'ı ve sağ-sol omuzdaki yazıcı melekleri hatırlatmak için nazil olmuştur."],
[51,"Zâriyât","الذاريات",60,"Mekkî Dönem (Hicret Öncesi)","Rüzgarlar üzerine yeminle başlayarak rızkın Allah'ın katında olduğunu, evrenin genişletildiğini ve cinlerle insanların yalnızca Allah'a kulluk için yaratıldığını bildirmek için indirilmiştir."],
[52,"Tûr","الطور",49,"Mekkî Dönem (Hicret Öncesi)","Tûr dağı ve Beyt-i Ma'mûr üzerine yeminle başlayarak inkarcıların azabının kesinliğini ve müminlerin cennet nimetlerini anlatmak için nazil olmuştur."],
[53,"Necm","النجم",62,"Mekkî Dönem (Hicret Öncesi)","Peygamberimizin kendi hevasından konuşmadığını, Miraç gecesi Sidretü'l-Müntehâ'da gördüğü büyük ayetleri ve insana ancak kendi çalışmasının karşılığı olduğunu bildirmek için indirilmiştir."],
[54,"Kamer","القمر",55,"Mekkî Dönem (Hicret Öncesi)","Müşriklerin mucize isteği üzerine Ay'ın ikiye yarılması (Şakk-ı Kamer) mucizesini haber vermek ve Kur'an'ın öğüt almak için kolaylaştırıldığını vurgulamak için nazil olmuştur."],
[55,"Rahmân","الرحمن",78,"Medenî Dönem","'O halde Rabbinizin hangi nimetlerini yalanlayabilirsiniz?' ayetiyle kainattaki maddi ve manevi nimetleri sayarak insanları ve cinleri şükre davet etmek için indirilmiştir."],
[56,"Vâkıa","الواقعة",96,"Mekkî Dönem (Hicret Öncesi)","Kıyamet koptuğunda insanların üç sınıfa (Ashab-ı Meymene, Ashab-ı Meş'eme ve Sâbikûn) ayrılacağını ve her birinin akıbetini detaylıca tasvir etmek için nazil olmuştur."],

function drawS(arr){
  document.getElementById("sList").innerHTML=arr.map(function(s){
    return '<div class="s-item" onclick="openS('+s.at(0)+')">'+
      '<div><strong style="color:var(--gold)">'+s.at(0)+'. '+s.at(1)+' Suresi</strong>'+
      '<div style="font-size:12px;color:var(--muted)">'+s.at(4)+' • '+s.at(3)+' Ayet</div></div>'+
      '<div style="font-family:Amiri,serif;font-size:24px;color:var(--gold)">'+s.at(2)+'</div></div>';
  }).join("");
}
drawS(DB);
function loadJS(url){
  return new Promise(function(ok, err){
    var sc = document.createElement("script");
    sc.src = url;
    sc.onload = ok;
    sc.onerror = err;
    document.body.appendChild(sc);
  });
}

        '<div class="ar">'+v.text+' <span style="font-size:18px;color:var(--gold)">﴿'+v.verse+'﴾</span></div>'+
        '<div class="tr-read"><strong>Türkçe Okunuşu:</strong> '+okunus+'</div>'+
        '<div class="tr-mean"><strong>'+v.verse+'. Anlamı:</strong> '+meal+'</div>'+
      '</div>';
    }).join("");
  }).catch(function(e){
    box.innerHTML='<p style="color:#ff8080">Hata: '+e.message+'</p>';
  });
}

function closeS(){
  document.getElementById("reader").style.display="none";
  document.getElementById("sBox").style.display="block";
}
</script>
