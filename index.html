<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nur-u Kur'an | İslami İlimler, Kıble, Tefsir & Havas Külliyatı</title>
    <!-- Google Fonts: Zarif İslami Hat ve Modern Tipografi -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-deep: #071912;
            --bg-card: #0d261c;
            --bg-card-hover: #123326;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f0f4f2;
            --text-muted: #9eb3a8;
            --border-gold: rgba(212, 175, 55, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, #123829 0%, transparent 65%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://w3.org fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Üst Başlık ve Arapça Hat */
        header {
            text-align: center;
            padding: 3.5rem 1rem 2rem;
            border-bottom: 1px solid var(--border-gold);
            background: linear-gradient(180deg, rgba(7,25,18,0.9) 0%, rgba(13,38,28,0.4) 100%);
        }

        .arabic-logo {
            font-family: 'Amiri', serif;
            font-size: 3.8rem;
            color: var(--gold-primary);
            text-shadow: 0 0 25px var(--gold-glow);
            margin-bottom: 0.2rem;
            letter-spacing: 2px;
        }

        .app-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.5rem;
            color: var(--gold-light);
            letter-spacing: 3px;
            margin-bottom: 0.6rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Navigasyon Menüsü */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding: 1.5rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 25, 18, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .nav-btn {
            background: rgba(13, 38, 28, 0.8);
            border: 1px solid var(--border-gold);
            color: var(--text-main);
            padding: 0.65rem 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, #2b6b4f, #1a4734);
            border-color: var(--gold-primary);
            color: var(--gold-light);
            box-shadow: 0 0 18px var(--gold-glow);
            transform: translateY(-2px);
        }

        /* Ana Konteyner */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem 4rem;
        }

        .section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Kart Izgarası */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 1.8rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            opacity: 0.6;
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            border-color: var(--gold-primary);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px var(--gold-glow);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-primary);
            font-size: 1.2rem;
        }

        .card h3 {
            color: var(--gold-primary);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card-action {
            margin-top: 1.2rem;
            display: inline-block;
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        /* Kur'an ve Sureler Bölümü */
        .search-bar {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-gold);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .surah-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .surah-item {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.25s;
        }

        .surah-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--gold-primary);
        }

        .surah-num {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            margin-right: 0.8rem;
        }

        .badge {
            font-size: 0.72rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            color: var(--gold-light);
        }

        /* Sure Okuma ve Tefsir Modalı */
        .reader-box {
            background: var(--bg-card);
            border: 1px solid var(--gold-primary);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1.5rem;
            display: none;
        }

        .ayah-box {
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            text-align: right;
            color: var(--gold-light);
            line-height: 2.2;
            margin-bottom: 0.8rem;
            direction: rtl;
        }

        .turkish-meal {
            color: var(--text-main);
            font-size: 1.05rem;
        }

        .tefsir-note {
            margin-top: 0.8rem;
            padding: 0.8rem 1rem;
            background: rgba(7, 25, 18, 0.6);
            border-left: 3px solid var(--gold-primary);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Kıble Pusulası */
        .compass-container {
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 2.5rem;
        }

        .compass-dial {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 4px solid var(--gold-primary);
            margin: 1.5rem auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
